<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>OGP Image — shifty</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #F0F2F5;
  }

  .card {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #fff7f3 0%, #fff0e8 50%, #fde8d8 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 60px 72px;
    position: relative;
    overflow: hidden;
  }

  /* 背景装飾サークル */
  .card::before {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(248,112,54,0.12) 0%, transparent 70%);
    top: -120px;
    right: -80px;
  }
  .card::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(248,112,54,0.08) 0%, transparent 70%);
    bottom: -80px;
    left: 200px;
  }

  /* 左側：テキスト */
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 24px;
    z-index: 1;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-icon {
    width: 56px;
    height: 56px;
    background: #f87036;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg {
    width: 34px;
    height: 34px;
  }

  .logo-text {
    font-size: 36px;
    font-weight: 800;
    color: #1A1A2E;
    letter-spacing: -0.5px;
  }

  .tagline {
    font-size: 48px;
    font-weight: 800;
    color: #1A1A2E;
    line-height: 1.2;
    letter-spacing: -1px;
  }

  .tagline .accent {
    color: #f87036;
  }

  .desc {
    font-size: 22px;
    color: #374151;
    line-height: 1.6;
    font-weight: 400;
  }

  .badges {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .badge {
    background: white;
    border: 2px solid #f87036;
    color: #f87036;
    border-radius: 100px;
    padding: 6px 18px;
    font-size: 18px;
    font-weight: 700;
  }

  .badge.filled {
    background: #f87036;
    color: white;
  }

  /* 右側：モックアップ */
  .right {
    flex: 0 0 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .mockup {
    width: 340px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  .mockup-header {
    background: #f87036;
    padding: 16px 20px;
    color: white;
    font-weight: 700;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mockup-body {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .shift-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }

  .shift-name {
    width: 72px;
    font-weight: 600;
    color: #374151;
    font-size: 13px;
  }

  .shift-cell {
    flex: 1;
    height: 30px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
  }

  .shift-cell.morning { background: #FEF3C7; color: #92400E; }
  .shift-cell.lunch   { background: #DBEAFE; color: #1D4ED8; }
  .shift-cell.dinner  { background: #D1FAE5; color: #065F46; }
  .shift-cell.off     { background: #F3F4F6; color: #9CA3AF; }

  .mockup-footer {
    padding: 12px 20px;
    background: #F9FAFB;
    border-top: 1px solid #E5E7EB;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .excel-btn {
    background: #1D6F42;
    color: white;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .domain {
    position: absolute;
    bottom: 28px;
    right: 72px;
    font-size: 18px;
    color: #9CA3AF;
    font-weight: 500;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="26" height="26" rx="4" stroke="white" stroke-width="2.5" fill="none"/>
          <line x1="4" y1="11" x2="30" y2="11" stroke="white" stroke-width="2.5"/>
          <line x1="11" y1="4" x2="11" y2="11" stroke="white" stroke-width="2.5"/>
          <line x1="23" y1="4" x2="23" y2="11" stroke="white" stroke-width="2.5"/>
          <rect x="8" y="16" width="5" height="5" rx="1" fill="white"/>
          <rect x="15" y="16" width="5" height="5" rx="1" fill="white"/>
          <rect x="22" y="16" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
          <rect x="8" y="23" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
          <rect x="15" y="23" width="5" height="5" rx="1" fill="white"/>
        </svg>
      </div>
      <span class="logo-text">shifty</span>
    </div>

    <div class="tagline">
      シフト管理を<br><span class="accent">もっとシンプル</span>に
    </div>

    <div class="desc">
      スタッフはスマホで希望を提出。<br>
      店長はExcelで一括管理。登録不要。
    </div>

    <div class="badges">
      <span class="badge filled">完全無料</span>
      <span class="badge">登録不要</span>
      <span class="badge">Excel出力</span>
      <span class="badge">スマホ対応</span>
    </div>
  </div>

  <div class="right">
    <div class="mockup">
      <div class="mockup-header">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="14" height="14" rx="2" stroke="white" stroke-width="1.5" fill="none"/>
          <line x1="1" y1="5" x2="15" y2="5" stroke="white" stroke-width="1.5"/>
          <line x1="5" y1="1" x2="5" y2="5" stroke="white" stroke-width="1.5"/>
          <line x1="11" y1="1" x2="11" y2="5" stroke="white" stroke-width="1.5"/>
        </svg>
        6月シフト希望（7名提出済み）
      </div>
      <div class="mockup-body">
        <div class="shift-row">
          <span class="shift-name">田中 さくら</span>
          <span class="shift-cell morning">朝</span>
          <span class="shift-cell lunch">昼</span>
          <span class="shift-cell dinner">夜</span>
          <span class="shift-cell morning">朝</span>
          <span class="shift-cell off">休</span>
        </div>
        <div class="shift-row">
          <span class="shift-name">鈴木 けんと</span>
          <span class="shift-cell off">休</span>
          <span class="shift-cell dinner">夜</span>
          <span class="shift-cell dinner">夜</span>
          <span class="shift-cell lunch">昼</span>
          <span class="shift-cell dinner">夜</span>
        </div>
        <div class="shift-row">
          <span class="shift-name">山本 あおい</span>
          <span class="shift-cell lunch">昼</span>
          <span class="shift-cell morning">朝</span>
          <span class="shift-cell off">休</span>
          <span class="shift-cell dinner">夜</span>
          <span class="shift-cell lunch">昼</span>
        </div>
        <div class="shift-row">
          <span class="shift-name">佐藤 ゆうき</span>
          <span class="shift-cell dinner">夜</span>
          <span class="shift-cell off">休</span>
          <span class="shift-cell lunch">昼</span>
          <span class="shift-cell morning">朝</span>
          <span class="shift-cell off">休</span>
        </div>
      </div>
      <div class="mockup-footer">
        <div class="excel-btn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="1" y="1" width="12" height="12" rx="1.5" fill="white" opacity="0.3"/>
            <path d="M3 4l2.5 3L3 10h1.5L7 7.5 9 10h1.5L8 7l2.5-3H9L7 6.5 5 4H3z" fill="white"/>
          </svg>
          Excelで出力
        </div>
        <span style="font-size:12px; color:#6B7280; margin-left:4px;">シフト表を自動生成</span>
      </div>
    </div>
  </div>

  <span class="domain">shiftyshifty.app</span>
</div>
</body>
</html>
