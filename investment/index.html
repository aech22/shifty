<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>TODGE 投資ダッシュボード</title>
  <style>
    :root {
      --bg: #0F172A;
      --card: #1E293B;
      --border: #334155;
      --text: #F1F5F9;
      --text2: #94A3B8;
      --text3: #64748B;
      --green: #22C55E;
      --red: #EF4444;
      --orange: #f87036;
      --blue: #3B82F6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Hiragino Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      position: sticky;
      top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 10px;
      z-index: 10;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .logo { font-size: 13px; font-weight: 700; color: var(--orange); }
    .updated { font-size: 11px; color: var(--text3); }
    .next-update { font-size: 11px; color: var(--text3); }

    /* サマリーカード */
    .summary {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .summary-card.full { grid-column: 1 / -1; }
    .summary-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-weight: 600; letter-spacing: .5px; }
    .summary-value { font-size: 22px; font-weight: 800; }
    .summary-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .neu { color: var(--text2); }

    /* セクション */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      letter-spacing: 1px;
      padding: 0 16px 8px;
    }

    /* 銘柄行 */
    .stock-list { padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px; }
    .stock-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 8px;
    }
    .stock-name { font-size: 14px; font-weight: 700; }
    .stock-symbol { font-size: 11px; color: var(--text3); }
    .stock-price { font-size: 15px; font-weight: 700; text-align: right; }
    .stock-detail { font-size: 11px; color: var(--text2); }
    .stock-pnl { font-size: 12px; font-weight: 600; text-align: right; }
    .stock-shares { font-size: 11px; color: var(--text3); }

    /* 未設定バッジ */
    .badge-demo {
      font-size: 10px;
      background: rgba(248,112,54,.15);
      color: var(--orange);
      border: 1px solid rgba(248,112,54,.3);
      border-radius: 6px;
      padding: 1px 6px;
      margin-left: 6px;
    }

    /* リフレッシュボタン */
    .refresh-btn {
      display: block;
      margin: 12px 16px 24px;
      width: calc(100% - 32px);
      padding: 13px;
      background: var(--orange);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* エラー */
    .error { padding: 20px 16px; color: var(--red); font-size: 13px; }

    /* ローディング */
    .loading { text-align: center; padding: 60px 16px; color: var(--text3); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="logo">TODGE 投資デモ</div>
      <div class="updated" id="updated">取得中...</div>
    </div>
    <div class="next-update" id="next-update"></div>
  </header>

  <div id="app"><div class="loading">データを取得中...</div></div>

  <script>
    const PORTFOLIO_URL = './portfolio.json?' + Date.now();
    let refreshTimer = null;
    let countdownTimer = null;
    let nextRefreshAt = null;

    const fmt = (n, digits = 0) =>
      new Intl.NumberFormat('ja-JP', { maximumFractionDigits: digits }).format(n);

    const signColor = n => n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu';
    const sign = n => n > 0 ? '+' : '';

    function renderStock(s) {
      const hasPosition = s.shares > 0;
      const priceStr = s.market === 'JP'
        ? `¥${fmt(s.current_price)}`
        : `$${fmt(s.current_price, 2)}`;
      const dayStr = `${sign(s.day_change_pct)}${s.day_change_pct.toFixed(2)}%`;
      const pnlStr = hasPosition
        ? `${sign(s.pnl)}¥${fmt(Math.abs(s.pnl))} (${sign(s.pnl_pct)}${s.pnl_pct.toFixed(2)}%)`
        : '未購入';

      return `
        <div class="stock-card">
          <div>
            <div class="stock-name">${s.name}<span class="badge-demo">${s.market}</span></div>
            <div class="stock-symbol">${s.symbol}</div>
          </div>
          <div>
            <div class="stock-price">${priceStr}</div>
            <div class="stock-pnl ${signColor(s.day_change_pct)}">${dayStr} 本日</div>
          </div>
          <div class="stock-detail">${hasPosition ? `${fmt(s.shares)}株 × 取得${s.market==='JP'?'¥':'$'}${fmt(s.avg_price, s.market==='JP'?0:2)}` : '―'}</div>
          <div class="stock-pnl ${hasPosition ? signColor(s.pnl) : 'neu'}">${pnlStr}</div>
        </div>`;
    }

    function render(data) {
      const t = data.total;
      const uninvested = t.invested === 0;

      const jpStocks = data.stocks.filter(s => s.market === 'JP');
      const usStocks = data.stocks.filter(s => s.market === 'US');

      const updatedAt = new Date(data.updated);
      document.getElementById('updated').textContent =
        updatedAt.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}) + ' 更新';

      document.getElementById('app').innerHTML = `
        <div class="summary">
          <div class="summary-card full">
            <div class="summary-label">ポートフォリオ評価額</div>
            <div class="summary-value ${uninvested ? '' : signColor(t.pnl)}">
              ¥${fmt(uninvested ? data.initial_capital : t.current)}
            </div>
            <div class="summary-sub">
              ${uninvested
                ? `元本 ¥${fmt(data.initial_capital)}（デモ・未購入）`
                : `損益 ${sign(t.pnl)}¥${fmt(t.pnl)} (${sign(t.pnl_pct)}${t.pnl_pct.toFixed(2)}%)`
              }
            </div>
          </div>
          <div class="summary-card">
            <div class="summary-label">投資済み</div>
            <div class="summary-value">¥${fmt(t.invested)}</div>
            <div class="summary-sub">元本 ¥${fmt(data.initial_capital)}</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">キャッシュ</div>
            <div class="summary-value">¥${fmt(data.cash)}</div>
            <div class="summary-sub">${uninvested ? '100%' : ((data.cash/data.initial_capital*100).toFixed(1) + '%')}</div>
          </div>
        </div>

        <div class="section-title">日本株 JP</div>
        <div class="stock-list">${jpStocks.map(renderStock).join('')}</div>

        <div class="section-title" style="margin-top:8px">海外株 US</div>
        <div class="stock-list">${usStocks.map(renderStock).join('')}</div>

        <button class="refresh-btn" onclick="load()">今すぐ更新</button>
      `;
    }

    function startCountdown() {
      clearInterval(countdownTimer);
      nextRefreshAt = Date.now() + 60 * 60 * 1000;
      countdownTimer = setInterval(() => {
        const left = Math.max(0, Math.round((nextRefreshAt - Date.now()) / 60000));
        document.getElementById('next-update').textContent = `次回更新まで約${left}分`;
        if (left === 0) load();
      }, 60000);
    }

    async function load() {
      try {
        const res = await fetch('./portfolio.json?t=' + Date.now());
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();
        render(data);
        startCountdown();
      } catch (e) {
        document.getElementById('app').innerHTML =
          `<div class="error">データ取得エラー。portfolio.jsonが存在しないか、ネットワークエラーです。<br><br>${e.message}</div>
           <button class="refresh-btn" onclick="load()">再試行</button>`;
      }
    }

    load();
  </script>
</body>
</html>
