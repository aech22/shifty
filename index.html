  <style>
    /* ===== テーマカラー変数（ライトモード） ===== */
    :root {
      --c-bg:      #F0F2F5;
      --c-card:    #FFFFFF;
      --c-input:   #F3F4F6;
      --c-input2:  #F0F2F5;
      --c-border:  #E5E7EB;
      --c-border2: #D1D5DB;
      --c-text:    #1A1A2E;
      --c-text2:   #374151;
      --c-text3:   #6B7280;
      --c-text4:   #9CA3AF;
      --c-shadow:  rgba(0,0,0,.06);
    }
    /* ダークモード変数 */
    :root[data-theme="dark"] {
      --c-bg:      #0F172A;
      --c-card:    #1E293B;
      --c-input:   #2D3748;
      --c-input2:  #263044;
      --c-border:  #334155;
      --c-border2: #475569;
      --c-text:    #F1F5F9;
      --c-text2:   #CBD5E1;
      --c-text3:   #94A3B8;
      --c-text4:   #64748B;
      --c-shadow:  rgba(0,0,0,.3);
    }
    /* OS設定がダークのときのデフォルト（手動設定がない場合） */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="dark"]) {
        --c-bg:      #0F172A;
        --c-card:    #1E293B;
        --c-input:   #2D3748;
        --c-input2:  #263044;
        --c-border:  #334155;
        --c-border2: #475569;
        --c-text:    #F1F5F9;
        --c-text2:   #CBD5E1;
        --c-text3:   #94A3B8;
        --c-text4:   #64748B;
        --c-shadow:  rgba(0,0,0,.3);
      }
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Hiragino Sans','Yu Gothic',sans-serif;background:var(--c-bg);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
    /* iOS Safariのsafe-area対応（ノッチ・ホームバー） */
    body{padding-bottom:env(safe-area-inset-bottom,0);}
    /* iOS Safariのposition:sticky対応 */
    .sticky-header{position:-webkit-sticky;position:sticky;}
    /* Androidのタップハイライトを無効化 */
    button,a,div[onClick]{-webkit-tap-highlight-color:transparent;}
    /* iOS Safariでinputがズームしないようにフォントサイズを16px以上に */
    input,select,textarea{font-size:16px;}
    @keyframes sU{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes fI{from{opacity:0}to{opacity:1}}
    @keyframes sI{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
    @keyframes bI{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
    select,input,button,textarea{font-family:inherit;}
    .dc{transition:box-shadow .2s;}
    .dc:hover{box-shadow:0 4px 20px rgba(0,0,0,.12)!important;}
    .cb:active{transform:scale(.96);}
    input[type=date]{color-scheme:light;-webkit-appearance:none;appearance:none;}
    :root[data-theme="dark"] input[type=date]{color-scheme:dark;}
    /* Androidのdate inputスタイル統一 */
    input[type=date]::-webkit-calendar-picker-indicator{opacity:0.5;}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-thumb{background:var(--c-border2);border-radius:2px;}
    .name-suggest{position:absolute;top:100%;left:0;right:0;background:var(--c-card);border:1px solid var(--c-border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200;max-height:200px;overflow-y:auto;margin-top:4px;}
    .name-suggest-item{padding:12px 16px;cursor:pointer;font-size:15px;font-weight:600;color:var(--c-text);}
    .name-suggest-item:hover{background:var(--c-input);}
    .name-suggest-item:active{background:var(--c-input2);}
  </style>
